<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股 AI 分析师 · 控制台</title>
<script src="/static/echarts.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a; --panel: #131a2c; --panel2: #1a2340; --line: #232f52;
    --txt: #e6ecf8; --dim: #7c89a8; --up: #22d3a7; --down: #f45b6c;
    --accent: #5b8cff; --gold: #f5b84c;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--txt); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 28px;
           background: linear-gradient(120deg, #10182e 0%, #16213f 60%, #1b2a52 100%);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 19px; letter-spacing: .5px; }
  header h1 em { font-style: normal; color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .dot.off { background: var(--dim); }
  .mkt { font-size: 12px; color: var(--dim); }
  #clock { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

  main { padding: 20px 28px; max-width: 1440px; margin: 0 auto; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .card { background: linear-gradient(160deg, var(--panel) 0%, var(--panel2) 100%);
          border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
          position: relative; overflow: hidden; }
  .card::after { content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
                 background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .5; }
  .card .k { font-size: 12px; color: var(--dim); }
  .card .v { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 12px; margin-top: 4px; color: var(--dim); }
  .up { color: var(--up); } .down { color: var(--down); }

  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 18px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .panel h3 { font-size: 13px; color: var(--dim); font-weight: 500; margin-bottom: 8px; }
  .chart { width: 100%; height: 300px; }
  .chart.sm { height: 260px; }

  .tabs { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
  .tabs button { background: var(--panel); color: var(--dim); border: 1px solid var(--line);
                 padding: 8px 18px; border-radius: 9px; cursor: pointer; font-size: 13px; transition: .15s; }
  .tabs button:hover { color: var(--txt); border-color: var(--accent); }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabs .badge { background: var(--down); color: #fff; border-radius: 8px; padding: 1px 7px;
                 font-size: 11px; margin-left: 5px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; background: rgba(255,255,255,.02); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(91,140,255,.05); }
  td.reason { max-width: 340px; white-space: normal; color: var(--dim); font-size: 12px; }

  .tag { padding: 2px 9px; border-radius: 6px; font-size: 11px; white-space: nowrap; }
  .tag.executed { background: rgba(34,211,167,.15); color: var(--up); }
  .tag.pending_approval { background: rgba(245,184,76,.15); color: var(--gold); }
  .tag.rejected, .tag.gated { background: rgba(244,91,108,.15); color: var(--down); }
  .tag.skipped, .tag.approved { background: rgba(124,137,168,.15); color: var(--dim); }
  .tag.info { background: rgba(91,140,255,.15); color: var(--accent); }
  .tag.alert, .tag.halt { background: rgba(244,91,108,.15); color: var(--down); }
  .tag.buy { background: rgba(34,211,167,.15); color: var(--up); }
  .tag.sell { background: rgba(244,91,108,.15); color: var(--down); }

  .btn { padding: 5px 14px; border: none; border-radius: 7px; cursor: pointer; font-size: 12px; margin-right: 6px; }
  .btn.ok { background: var(--up); color: #06281f; font-weight: 600; }
  .btn.no { background: transparent; color: var(--down); border: 1px solid var(--down); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }

  #toast { position: fixed; bottom: 24px; right: 24px; background: var(--panel2);
           border: 1px solid var(--accent); border-radius: 10px; padding: 12px 20px;
           font-size: 13px; display: none; z-index: 99; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>

<header>
  <h1>📈 美股 <em>AI</em> 分析师</h1>
  <span class="mkt"><span id="mktDot" class="dot off"></span><span id="mktTxt">连接中…</span></span>
  <span id="clock"></span>
</header>

<main>
  <!-- 指标卡 -->
  <div class="cards" id="cards"></div>

  <!-- 图表区 -->
  <div class="grid">
    <div class="panel"><h3>净值曲线</h3><div id="equityChart" class="chart"></div></div>
    <div class="panel"><h3>持仓分布</h3><div id="allocChart" class="chart"></div></div>
  </div>
  <div class="grid" style="grid-template-columns: 1fr 1fr;">
    <div class="panel"><h3>已平仓盈亏（按交易）</h3><div id="pnlChart" class="chart sm"></div></div>
    <div class="panel"><h3>决策状态分布</h3><div id="decChart" class="chart sm"></div></div>
  </div>

  <!-- 数据表 -->
  <div class="tabs" id="tabs">
    <button type="button" class="active" data-t="pending">待批准 <span class="badge" id="pendBadge" style="display:none"></span></button>
    <button type="button" data-t="positions">持仓</button>
    <button type="button" data-t="trades">历史交易</button>
    <button type="button" data-t="decisions">决策记录</button>
    <button type="button" data-t="orders">订单</button>
    <button type="button" data-t="events">事件日志</button>
  </div>
  <div id="content"></div>
</main>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let current = 'pending', cache = {}, charts = {};

async function j(u, opt){ const r = await fetch(u, opt); if(!r.ok) throw new Error((await r.json()).detail || r.statusText); return r.json(); }
const pct = (x,d=2) => x==null ? '-' : (x*100).toFixed(d)+'%';
const money = x => '$' + Number(x).toLocaleString(undefined,{maximumFractionDigits:0});
const cls = x => x>0?'up':(x<0?'down':'');
const sign = x => (x>0?'+':'') + pct(x);
function toast(msg, ok=true){
  const t = $('#toast'); t.textContent = msg;
  t.style.borderColor = ok ? 'var(--up)' : 'var(--down)'; t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3000);
}

/* ================= 图表 ================= */
function mkChart(id){
  if(!charts[id]) charts[id] = echarts.init($('#'+id), null, {renderer:'canvas'});
  return charts[id];
}
const axStyle = { axisLine:{lineStyle:{color:'#232f52'}}, axisLabel:{color:'#7c89a8',fontSize:11}, splitLine:{lineStyle:{color:'#1a2340'}} };

async function renderEquity(){
  const ch = mkChart('equityChart');
  let rows = await j('/api/equity');
  if(rows.length === 0 && cache.s) rows = [{ts: new Date().toISOString(), equity: cache.s.account.equity}];
  if(rows.length === 0){ ch.clear(); return; }
  const data = rows.map(r => [r.ts.replace('T',' ').slice(5,16), +r.equity.toFixed(0)]);
  const base = 100000, last = data[data.length-1][1];
  const color = last >= base ? '#22d3a7' : '#f45b6c';
  const vals = data.map(d=>d[1]).concat([base]);
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max((hi-lo)*0.15, 500);
  ch.setOption({
    grid:{left:60,right:60,top:20,bottom:30},
    tooltip:{trigger:'axis', backgroundColor:'#1a2340', borderColor:'#232f52', textStyle:{color:'#e6ecf8'},
             formatter: p => `${p[0].axisValue}<br/>净值 ${money(p[0].data[1])} (${((p[0].data[1]/base-1)*100).toFixed(2)}%)`},
    xAxis:{type:'category', ...axStyle}, yAxis:{type:'value', min:Math.floor(lo-pad), max:Math.ceil(hi+pad), ...axStyle,
      axisLabel:{...axStyle.axisLabel, formatter: v=>'$'+(v/1000)+'k'}},
    series:[{type:'line', data, smooth:true, symbol:'none', lineStyle:{color, width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:color+'44'},{offset:1,color:color+'00'}]}},
      markLine:{silent:true, symbol:'none', lineStyle:{color:'#7c89a8', type:'dashed'},
        label:{color:'#7c89a8', formatter:'初始 $100k', position:'insideStartTop'}, data:[{yAxis:base}]}}]
  }, true);
}

function renderAlloc(){
  const ch = mkChart('allocChart');
  const s = cache.s; if(!s) return;
  const items = s.positions.map(p => ({name:p.symbol, value:+p.market_value.toFixed(0)}));
  items.push({name:'现金', value:+s.account.cash.toFixed(0), itemStyle:{color:'#2d3e5f'}});
  ch.setOption({
    tooltip:{backgroundColor:'#1a2340', borderColor:'#232f52', textStyle:{color:'#e6ecf8'},
             formatter: p => `${p.name}: ${money(p.value)} (${p.percent}%)`},
    series:[{type:'pie', radius:['52%','78%'], center:['50%','52%'],
      label:{color:'#e6ecf8', fontSize:12, formatter:'{b}\n{d}%'},
      labelLine:{lineStyle:{color:'#7c89a8'}},
      itemStyle:{borderColor:'#0a0e1a', borderWidth:2, borderRadius:6},
      color:['#5b8cff','#22d3a7','#f5b84c','#a78bfa','#f472b6','#38bdf8'],
      data: items.length ? items : [{name:'无持仓', value:1, itemStyle:{color:'#232f52'}}]}]
  }, true);
}

async function renderPnl(){
  const ch = mkChart('pnlChart');
  const rows = (await j('/api/trades')).filter(t=>t.status==='closed').reverse();
  if(rows.length===0){ ch.clear(); ch.setOption({title:{text:'暂无已平仓交易', left:'center', top:'middle', textStyle:{color:'#7c89a8', fontSize:13, fontWeight:'normal'}}}, true); return; }
  ch.setOption({
    grid:{left:50,right:20,top:20,bottom:40},
    tooltip:{backgroundColor:'#1a2340', borderColor:'#232f52', textStyle:{color:'#e6ecf8'},
             formatter: p => { const t=rows[p.dataIndex]; return `${t.symbol}<br/>${sign(t.return_pct)}<br/>${t.lesson||''}`; }},
    xAxis:{type:'category', data:rows.map(t=>t.symbol), ...axStyle},
    yAxis:{type:'value', ...axStyle, axisLabel:{...axStyle.axisLabel, formatter:v=>(v*100).toFixed(0)+'%'}},
    series:[{type:'bar', data:rows.map(t=>+t.return_pct.toFixed(4)), barMaxWidth:36,
      itemStyle:{borderRadius:[5,5,0,0], color: p => p.data>=0?'#22d3a7':'#f45b6c'}}]
  }, true);
}

async function renderDec(){
  const ch = mkChart('decChart');
  const rows = await j('/api/decisions?limit=200');
  const cnt = {};
  rows.forEach(d => { cnt[d.status] = (cnt[d.status]||0)+1; });
  if(rows.length===0){ ch.clear(); ch.setOption({title:{text:'暂无决策记录', left:'center', top:'middle', textStyle:{color:'#7c89a8', fontSize:13, fontWeight:'normal'}}}, true); return; }
  const labelMap = {executed:'已执行', pending_approval:'待批准', rejected:'已拒绝', gated:'风控拦截', skipped:'观望', approved:'已通过'};
  const colorMap = {executed:'#22d3a7', pending_approval:'#f5b84c', rejected:'#f45b6c', gated:'#fb923c', skipped:'#5b8cff', approved:'#7c89a8'};
  ch.setOption({
    tooltip:{backgroundColor:'#1a2340', borderColor:'#232f52', textStyle:{color:'#e6ecf8'}},
    series:[{type:'pie', radius:['40%','70%'], center:['50%','52%'],
      label:{color:'#e6ecf8', fontSize:12, formatter:'{b} {c}'},
      itemStyle:{borderColor:'#0a0e1a', borderWidth:2, borderRadius:6},
      data:Object.entries(cnt).map(([k,v])=>({name:labelMap[k]||k, value:v, itemStyle:{color:colorMap[k]||'#7c89a8'}}))}]
  }, true);
}

/* ================= 指标卡 & 表格 ================= */
async function loadAll(){
  try {
    const s = await j('/api/status'); cache.s = s;
    $('#mktDot').className = 'dot ' + (s.market_open?'on':'off');
    $('#mktTxt').textContent = s.market_open ? '开盘中' : '已收盘';
    const a = s.account;
    const dayPnl = a.equity - a.last_equity, dayPnlPct = dayPnl / a.last_equity;
    const totPnlPct = a.equity / 100000 - 1;
    $('#cards').innerHTML = `
      <div class="card"><div class="k">总资产</div><div class="v">${money(a.equity)}</div>
        <div class="s ${cls(totPnlPct)}">累计 ${sign(totPnlPct)}</div></div>
      <div class="card"><div class="k">今日盈亏</div><div class="v ${cls(dayPnl)}">${dayPnl>=0?'+':''}${money(dayPnl).replace('$-','-$')}</div>
        <div class="s ${cls(dayPnlPct)}">${sign(dayPnlPct)}</div></div>
      <div class="card"><div class="k">现金</div><div class="v">${money(a.cash)}</div>
        <div class="s">可用 ${pct(a.cash/a.equity,1)}</div></div>
      <div class="card"><div class="k">持仓数</div><div class="v">${s.positions.length}<span style="font-size:14px;color:var(--dim)"> / 5</span></div>
        <div class="s">${s.positions.map(p=>p.symbol).join(' · ')||'空仓'}</div></div>`;
  } catch(e){
    $('#cards').innerHTML = `<div class="card"><div class="k">连接失败</div><div class="s">${e.message}</div></div>`;
  }
  renderEquity(); renderAlloc(); renderPnl(); renderDec(); render();
}

async function render(){
  const el = $('#content');
  try {
    if(current==='pending'){
      const rows = await j('/api/decisions?status=pending_approval');
      const b = $('#pendBadge'); b.style.display = rows.length?'inline':'none'; b.textContent = rows.length;
      el.innerHTML = rows.length ? `<table><tr><th>ID</th><th>时间</th><th>操作</th><th>标的</th><th>置信度</th><th>理由</th><th>反方异议</th><th></th></tr>` +
        rows.map(d=>{const a=JSON.parse(d.advocate_verdict||'{}');return `<tr><td>#${d.id}</td><td>${d.ts.slice(5,19).replace('T',' ')}</td>
        <td><span class="tag ${d.action}">${d.action.toUpperCase()}</span></td><td><b>${d.symbol}</b></td>
        <td>${d.confidence}/10</td><td class="reason">${d.reasoning||''}</td><td class="reason">${a.comment||d.gate_reason||''}</td>
        <td style="white-space:nowrap"><button type="button" class="btn ok" onclick="act(${d.id},'approve')">✓ 批准</button>
        <button type="button" class="btn no" onclick="act(${d.id},'reject')">✕ 拒绝</button></td></tr>`}).join('')+'</table>'
        : '<div class="empty">暂无待批准提案 —— AI 全自主运行中</div>';
    } else if(current==='positions'){
      const ps = cache.s ? cache.s.positions : [];
      el.innerHTML = ps.length ? `<table><tr><th>标的</th><th>数量</th><th>成本价</th><th>现价</th><th>市值</th><th>浮盈</th></tr>` +
        ps.map(p=>`<tr><td><b>${p.symbol}</b></td><td>${p.qty}</td><td>$${p.avg_entry_price.toFixed(2)}</td><td>$${p.current_price.toFixed(2)}</td>
        <td>${money(p.market_value)}</td><td class="${cls(p.unrealized_plpc)}"><b>${sign(p.unrealized_plpc)}</b></td></tr>`).join('')+'</table>'
        : '<div class="empty">当前空仓</div>';
    } else if(current==='trades'){
      const rows = await j('/api/trades');
      const closed = rows.filter(t=>t.status==='closed');
      const wins = closed.filter(t=>t.return_pct>0).length;
      const stat = closed.length ? `<p style="color:var(--dim);font-size:12px;margin-bottom:10px">
        胜率 <b class="${wins/closed.length>=0.5?'up':'down'}">${(wins/closed.length*100).toFixed(0)}%</b>（${wins}胜/${closed.length-wins}负）·
        平均回报 ${sign(closed.reduce((s,t)=>s+t.return_pct,0)/closed.length)}</p>` : '';
      el.innerHTML = stat + (rows.length ? `<table><tr><th>标的</th><th>入场</th><th>出场</th><th>回报率</th><th>持有(h)</th><th>复盘教训</th></tr>` +
        rows.map(t=>`<tr><td><b>${t.symbol}</b></td><td>$${t.entry_price}</td><td>${t.exit_price?'$'+t.exit_price:'<span class="tag info">持仓中</span>'}</td>
        <td class="${cls(t.return_pct)}"><b>${t.return_pct==null?'-':sign(t.return_pct)}</b></td><td>${t.holding_hours||'-'}</td>
        <td class="reason" title="${(t.review||'').replace(/"/g,'&quot;')}">${t.lesson||''}</td></tr>`).join('')+'</table>'
        : '<div class="empty">还没有交易记录</div>');
    } else if(current==='decisions'){
      const rows = await j('/api/decisions');
      el.innerHTML = `<table><tr><th>ID</th><th>时间</th><th>操作</th><th>标的</th><th>置信度</th><th>状态</th><th>理由 / 拦截原因</th></tr>` +
        rows.map(d=>`<tr><td>#${d.id}</td><td>${d.ts.slice(5,19).replace('T',' ')}</td>
        <td><span class="tag ${d.action}">${d.action.toUpperCase()}</span></td><td>${d.symbol}</td><td>${d.confidence??'-'}</td>
        <td><span class="tag ${d.status}">${d.status}</span></td><td class="reason">${d.gate_reason||d.reasoning||''}</td></tr>`).join('')+'</table>';
    } else if(current==='orders'){
      const rows = await j('/api/orders');
      el.innerHTML = rows.length ? `<table><tr><th>时间</th><th>标的</th><th>方向</th><th>数量</th><th>金额</th><th>状态</th></tr>` +
        rows.map(o=>`<tr><td>${o.ts.slice(5,19).replace('T',' ')}</td><td><b>${o.symbol}</b></td>
        <td><span class="tag ${o.side}">${o.side.toUpperCase()}</span></td><td>${o.qty??'-'}</td><td>${o.notional?money(o.notional):'-'}</td><td>${o.status}</td></tr>`).join('')+'</table>'
        : '<div class="empty">暂无订单</div>';
    } else if(current==='events'){
      const rows = await j('/api/events');
      el.innerHTML = `<table><tr><th>时间</th><th>级别</th><th>内容</th></tr>` +
        rows.map(e=>`<tr><td style="white-space:nowrap">${e.ts.slice(5,19).replace('T',' ')}</td>
        <td><span class="tag ${e.level}">${e.level}</span></td><td class="reason" style="max-width:none">${e.message}</td></tr>`).join('')+'</table>';
    }
  } catch(e){ el.innerHTML = `<div class="empty" style="color:var(--down)">加载失败：${e.message}</div>`; }
}

async function act(id, action){
  if(!confirm(action==='approve' ? '确认批准执行该提案？' : '确认拒绝该提案？')) return;
  try {
    await j(`/api/decisions/${id}/${action}`, {method:'POST'});
    toast(action==='approve' ? '✓ 已批准并下单' : '✕ 已拒绝');
  } catch(e){ toast('操作失败：'+e.message, false); }
  render();
}

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  current = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x=>{ x.classList.remove("active"); });
  b.classList.add('active'); render();
});

setInterval(()=>{ $('#clock').textContent = new Date().toLocaleString('zh-CN',{hour12:false}); }, 1000);
window.addEventListener('resize', ()=> Object.values(charts).forEach(c=>{ c.resize(); }));

loadAll(); setInterval(loadAll, 60000);
</script>
</body>
</html>
