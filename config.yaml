# ============================================================
# 美股 AI 分析师 - 主配置（密钥不在这里，在 .env）
# ============================================================

models:
  base_url: "https://hyper.charm.land/v1"   # charmland OpenAI 兼容端点
  flash: "deepseek-v4-flash-0731"           # 新闻摘要/初筛（便宜）
  pro: "deepseek-v4-pro-0813"               # 决策/反方复审/复盘（强）
  temperature: 0.2

# 交易标的（方案 A：固定精选名单）
watchlist:
  core:    # 核心持仓候选，最多 10 只
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - AVGO
    - AMD
    - NFLX
    - JPM
  observe: # 观察名单，约 20 只
    - PLTR
    - CRM
    - ORCL
    - ADBE
    - QCOM
    - INTC
    - MU
    - TXN
    - UBER
    - SHOP
    - SQ
    - COIN
    - SNOW
    - DDOG
    - NET
    - CRWD
    - PANW
    - V
    - MA
    - COST

# 硬风控（AI 无权豁免）
risk:
  max_position_pct: 0.10        # 单票仓位 ≤ 总资产 10%
  max_positions: 5              # 总持仓 ≤ 5 只
  stop_loss_pct: 0.07           # 止损距离上限（兜底，正常由 2×ATR 决定且更小）
  daily_loss_circuit_pct: 0.03  # 当日浮亏 3% → 当天停止开新仓
  max_consecutive_circuit_days: 3  # 连续 3 天熔断 → 停机待人工
  min_confidence: 6             # AI 置信度 <6/10 不下单
  spike_pct: 0.03               # 持仓 5 分钟内 ±3% 触发异动加轮

# 专业交易策略（Van Tharp 风险百分比模型 + 金字塔加仓 + 吊灯止损）
# 原则：AI 管方向和置信度，仓位与出场由这里的数学规则决定
strategy:
  risk_per_trade_pct: 0.0075    # 单笔风险预算 = 净值 × 0.75%
  atr_stop_mult: 2.0            # 初始止损距离 = 2 × ATR(14)
  first_tranche_pct: 0.5        # 首仓只建计划仓位的 1/2
  pyramid_max_adds: 2           # 最多补仓 2 次
  pyramid_min_gain_r: 1.0       # 浮盈 ≥1R 才允许补仓（只加赢家，永不摊平）
  breakeven_after_r: 1.0        # 浮盈 ≥1R 后止损上移至成本价（保本）
  take_profit_r: 2.0            # 浮盈 ≥2R 卖出一半锁定利润
  chandelier_mult: 2.5          # 移动止损 = 持仓期最高价 - 2.5×ATR（只上移）
  max_portfolio_heat_pct: 0.03  # 组合总敞口风险 ≤ 净值 3%
  regime_sma_days: 50           # 大盘过滤：SPY 跌破日线 N 均线禁止买入
  no_entry_before_close_min: 30 # 收盘前 N 分钟禁止开新仓（卖出不限）
  time_stop_days: 4             # 持仓 N 天浮盈仍不足 → 时间止损
  time_stop_min_r: 0.5          # 时间止损阈值：浮盈 <0.5R
  max_per_sector: 3             # 同板块持仓上限（相关性风险控制）
  earnings_blackout_days: 3     # 财报前 N 天禁开新仓（需 Finnhub key）
  sectors:                      # 板块映射（用于集中度控制）
    AAPL: 科技
    MSFT: 科技
    NVDA: 科技
    GOOGL: 科技
    META: 科技
    AVGO: 科技
    AMD: 科技
    NFLX: 科技
    AMZN: 消费
    JPM: 金融

# 运行节奏
schedule:
  market_timezone: "America/New_York"
  bar_timeframe: "15Min"        # K线粒度
  lookback_days: 60             # 技术指标回看天数

# 数据
news:
  lookback_hours: 12            # 每轮拉取最近 12 小时新闻
  max_articles_per_symbol: 5    # 每只股票最多喂给 flash 的条数
  cache_ttl_hours: 2            # 新闻摘要缓存：同批文章不重复调 flash，超期重评（让时效衰减生效）

# 存储（相对项目根目录）
storage:
  db_path: "data/stock_ai.db"
  report_dir: "data/reports"
